<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 앱</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar app-navbar border-bottom">
        <div class="container d-flex flex-nowrap gap-2">
            <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="#">
                <span class="app-logo"><i class="bi bi-cloud-fill" aria-hidden="true"></i></span>
                <span class="fw-semibold">날씨 앱</span>
            </a>
            <input type="search" id="searchInput" class="form-control search-input ms-auto" placeholder="서울, 도쿄" aria-label="도시 검색">
            <button type="button" id="refreshBtn" class="btn btn-link refresh-btn p-1" aria-label="새로고침">
                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <main class="container py-3">
        <ul class="nav nav-pills gap-2 mb-3" id="groupTabs">
            <li class="nav-item">
                <button type="button" class="nav-link active" data-group="korea">한국 도시</button>
            </li>
            <li class="nav-item">
                <button type="button" class="nav-link" data-group="world">세계 주요 도시</button>
            </li>
        </ul>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">불러오는 중</span>
            </div>
        </div>

        <div id="errorBox" class="alert alert-danger align-items-center justify-content-between d-none" role="alert">
            <span>날씨 정보를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</span>
            <button type="button" id="retryBtn" class="btn btn-sm btn-outline-danger ms-3 flex-shrink-0">다시 시도</button>
        </div>

        <div id="cityGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></div>
        <p id="emptyMessage" class="text-secondary text-center py-5 d-none">일치하는 도시가 없습니다.</p>
        <p id="updatedAt" class="text-secondary small mt-3 mb-0"></p>
    </main>

    <div class="modal fade" id="forecastModal" tabindex="-1" aria-labelledby="forecastTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <div class="d-flex align-items-center gap-2">
                        <span id="forecastIcon" class="weather-chip"></span>
                        <h1 class="modal-title fs-6 fw-semibold" id="forecastTitle"></h1>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2 mb-3">
                        <div class="col-6 col-sm-3">
                            <div class="summary-cell summary-temp">
                                <div class="summary-label">현재 온도</div>
                                <div class="summary-value" id="summaryTemp"></div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="summary-cell summary-wind">
                                <div class="summary-label">풍속</div>
                                <div class="summary-value" id="summaryWind"></div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="summary-cell summary-dir">
                                <div class="summary-label">풍향</div>
                                <div class="summary-value" id="summaryDir"></div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="summary-cell summary-humidity">
                                <div class="summary-label">습도</div>
                                <div class="summary-value" id="summaryHumidity"></div>
                            </div>
                        </div>
                    </div>
                    <table class="table table-sm align-middle forecast-table mb-0">
                        <thead>
                            <tr>
                                <th scope="col">요일</th>
                                <th scope="col">날씨</th>
                                <th scope="col">최저 / 최고</th>
                                <th scope="col">강수</th>
                                <th scope="col">바람</th>
                            </tr>
                        </thead>
                        <tbody id="forecastBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cities.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
